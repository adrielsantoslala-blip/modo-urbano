    <header class="header">
        <a href="index.html" class="logo">

    <main class="page">
        <section class="section-title">
            <p class="eyebrow">FALE COM A GENTE</p>
            <h1>Entre em contato</h1>
            <p>Dúvidas sobre nossas peças? Mande uma mensagem.</p>

        <section class="contact-grid">
            <div class="contact-info">
                <h2>Modo Urbano</h2>

            <form id="contactForm" class="form" action="enviar_contato.php" method="POST">
                <label>
                    Nome
                    <input type="text" name="nome" placeholder="Seu nome" required>

                <label>
                    E-mail
                    <input type="email" name="email" placeholder="seuemail@email.com" required>
                </label>

                <label>
                    Mensagem
                    <textarea name="mensagem" rows="6" placeholder="Digite sua mensagem" required></textarea>
                </label>

                <button type="submit" class="btn">Enviar mensagem</button>
            </form>
        </section>
    </main>

    <footer>

        }
